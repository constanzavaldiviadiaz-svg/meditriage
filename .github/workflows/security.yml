name: MediTriage Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sast:
    name: Analisis de seguridad con Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Semgrep
        run: python -m pip install semgrep==1.187.0

      - name: Verificar version de Semgrep
        run: semgrep --version

      - name: Ejecutar analisis de seguridad
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config .semgrep/ \
            --error \
            --strict \
            src/

  secrets:
    name: Detectar secretos con Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v8.24.3
          curl -fsSLO "$BASE/gitleaks_8.24.3_linux_x64.tar.gz"
          curl -fsSLO "$BASE/gitleaks_8.24.3_checksums.txt"
          sha256sum --check --ignore-missing gitleaks_8.24.3_checksums.txt
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Buscar secretos
        run: gitleaks git . --redact --exit-code 1 --log-opts="--all"

  sca:
    name: Analisis de dependencias e imagen con Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Escanear dependencias de produccion (CRITICAL, con o sin parche)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: '.'
          scanners: vuln
          vuln-type: library
          severity: 'CRITICAL'
          exit-code: '1'
          format: table

      - name: Escanear dependencias de produccion (HIGH con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: '.'
          scanners: vuln
          vuln-type: library
          severity: 'HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Construir imagen para analisis
        run: docker build -t meditriage-api:security-scan .

      - name: Escanear imagen Docker (CRITICAL, con o sin parche)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: image
          image-ref: 'meditriage-api:security-scan'
          scanners: vuln
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          exit-code: '1'
          format: table

      - name: Escanear imagen Docker (HIGH con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: image
          image-ref: 'meditriage-api:security-scan'
          scanners: vuln
          vuln-type: 'os,library'
          severity: 'HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: table
