name: Build and Publish Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest

  publish:
    name: Build and publish to GHCR
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/meditriage-api:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.70.0'
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        id: publish
        run: |
          docker push "$IMAGE"

          REPO_DIGEST=$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "$IMAGE")

          DIGEST="${REPO_DIGEST##*@}"

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Display published digest
        run: |
          echo "Image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/meditriage-api@${{ steps.publish.outputs.digest }}"