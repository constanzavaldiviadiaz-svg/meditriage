name: MediTriage CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:
  ruff:
    name: Revisar calidad con Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Ruff
        run: python -m pip install ruff==0.8.4

      - name: Ejecutar Ruff
        run: ruff check .

  pytest:
    name: Pruebas y cobertura mínima 70%
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70


  semgrep:
    name: Analisis de seguridad con Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Ejecutar analisis de seguridad
        run: semgrep scan --config p/python --config p/security-audit --error src/


  spectral:
    name: Validar contrato OpenAPI con Spectral
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar Spectral
        run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml

        
  gitleaks:
    name: Detectar secretos con Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Instalar Gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Buscar secretos
        run: gitleaks git . --redact --exit-code 1
