name: MediTriage CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    name: Revisar calidad con Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Ruff
        run: python -m pip install ruff==0.8.4

      - name: Ejecutar Ruff
        run: ruff check .

  pytest:
    name: Pruebas y cobertura mínima 70%
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  spectral:
    name: Validar contrato OpenAPI con Spectral
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar Spectral
        run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml