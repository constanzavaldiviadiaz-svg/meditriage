name: MediTriage CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    name: Revisar calidad con Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Ruff
        run: python -m pip install ruff==0.8.4

      - name: Ejecutar Ruff
        run: ruff check .

  pytest:
    name: Pruebas y cobertura mínima 70%
    runs-on: ubuntu-latest

    # PostgreSQL real: los permisos, triggers y la cadena de hashes de la auditoría solo
    # existen en la base de datos (#121). Sin clave: solo es accesible desde este runner y se
    # destruye al terminar el job.
    services:
      postgres:
        image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PRUEBAS_ADMIN_URL: postgresql://postgres@localhost:5432/postgres

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  spectral:
    name: Validar contrato OpenAPI con Spectral
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar Spectral
        run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml
