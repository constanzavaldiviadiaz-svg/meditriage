apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-api
  namespace: meditriage
  labels:
    app: meditriage
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meditriage
  template:
    metadata:
      labels:
        app: meditriage
    spec:
      containers:
        - name: api
          image: ghcr.io/constanzavaldiviadiaz-svg/meditriage-api@sha256:5bb8eb9ada9cda3fcbd9a4e13cba365b1d494ecc574109c8253e2f23b9c89907
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUERTO
              value: "8080"
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: meditriage-config
                  key: AMBIENTE
            # La base principal, y la auditoría solo para leer (consulta de decisiones, HU05).
            # La credencial que escribe en la auditoría la tiene solo el worker
            # (worker-auditoria.yaml).
            - name: BASE_DATOS_URL
              valueFrom:
                secretKeyRef:
                  name: meditriage-bd
                  key: BASE_DATOS_URL
            - name: AUDITORIA_LECTURA_URL
              valueFrom:
                secretKeyRef:
                  name: meditriage-auditoria-lectura
                  key: AUDITORIA_LECTURA_URL
            # El motor de IA. La clave es opcional: sin el Secret, el pod arranca igual y con
            # MOTOR_IA=simulador no la necesita.
            - name: MOTOR_IA
              valueFrom:
                configMapKeyRef:
                  name: meditriage-config
                  key: MOTOR_IA
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meditriage-ia
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
