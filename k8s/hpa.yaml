apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meditriage-api-hpa
  namespace: meditriage
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meditriage-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
