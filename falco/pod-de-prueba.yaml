# Pod de prueba para las reglas de Falco (falco/probar-reglas.sh). Nunca se despliega.
#
# Simula un contenedor de la API comprometido: se llama igual que el contenedor de la API
# (api) y está en su namespace, así que las reglas lo vigilan. A diferencia de la imagen
# real, que es distroless, esta trae shell y herramientas para hacer disparar las reglas.
apiVersion: v1
kind: Pod
metadata:
  name: falco-prueba
  namespace: meditriage
  labels:
    # Distinta de "app: meditriage", para que el Service no le mande tráfico.
    app: falco-prueba
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      # La misma imagen base de la etapa de build del Dockerfile.
      image: python:3.11-slim@sha256:b7a9e5f6a93d6d4a31f129bbd4bdee69efccb6ded0fb230d78aafaf37af98377
      command: ["python3", "-c", "import time; time.sleep(3600)"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
