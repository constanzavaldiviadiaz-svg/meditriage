     frecuenciaRespiratoria: 28, temperatura: 36.8, saturacionOxigeno: 89}
  esiEsperado: 1
  fundamento: >
    Punto A. Anafilaxia con compromiso respiratorio e hipotensión: necesita adrenalina
    intramuscular de inmediato.

